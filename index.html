    <!--
      GitHub Pages SPA redirect handler (rafgraph/spa-github-pages technique).
      public/404.html encodes the requested path into a query string and redirects
      here; this snippet decodes it back into a real history entry before React
      Router takes over. See README.md "GitHub Pages Deployment" for details.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
